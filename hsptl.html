<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Login</title>
    <link rel="stylesheet" href="hsptl.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="h1">PRAS</h1>
            <div class="login-header">
                <h1>Hospital Login</h1>
                <a href="http://127.0.0.1:5500/frontpg.html" class="back-to-home">Back to Home</a>
            </div>
            <p class="login-description">Access your hospital dashboard</p>
            <form>
                <div class="form-group">
                    <label for="email">Hospital Email</label>
                    <input type="email" id="email" placeholder="name@hospital.com" required>
                </div>
                <div class="form-group password-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password"></button>
                    </div>
                </div>
            
                <button type="submit" class="sign-in-btn">Sign In</button>
                <a href="#" class="forgot-password">Forgot your password?</a>
            </form>
            <p class="register-text">Don't have an account? <a href="http://127.0.0.1:5500/hsptlreg.html" class="register-link">Register</a></p>
        </div>
    </div>
</body>
</html>
