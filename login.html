<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <h1 class="h1">PRAS</h1>
        <div class="header">

            
            <h2>Government Login</h2>
            <a href="http://127.0.0.1:5500/pendemic.html" class="back-to-home">Back to Home</a>
        </div>
        <p>Access your government dashboard</p>
        <form>
            <label for="gov-email">Government Email</label>
            <input type="email" id="gov-email" placeholder="email@government.com" required> 

            <label for="gov-password">Password</label>
            <input type="password" id="gov-password" placeholder="Enter your password" required >

        
            <form action="http://127.0.0.1:5500/Gdash.html">
                <button class="btn" type="submit">Sign In</button>
            </form>
            <a href="#" class="forgot-password">Forgot your password?</a>
            <a href="#" class="link">Don't have an account? Register</a>
        </form>
    </div>
</body>
</html>
